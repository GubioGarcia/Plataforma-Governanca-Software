# =============================================================================
# application-test.properties — Configurações para testes de integração
#
# Sobrescreve application.properties quando o perfil "test" está ativo.
# Usa H2 em memória no modo de compatibilidade PostgreSQL para validar
# a manipulação de dados sem depender de infraestrutura externa.
# =============================================================================

# ─── Banco de dados em memória (H2) ──────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ─── SQL Initialization: desabilita data.sql (usa sintaxe PostgreSQL exclusiva) ──
spring.sql.init.mode=never

# ─── Segurança / OAuth2 (valores fictícios para evitar chamadas ao Keycloak) ─
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/realms/test/protocol/openid-connect/certs
keycloak.issuer=http://localhost:9999/realms/test
keycloak.client-id=test-client
keycloak.client-secret=test-secret
keycloak.token-url=http://localhost:9999/realms/test/protocol/openid-connect/token
keycloak.admin.server-url=http://localhost:9999
keycloak.admin.realm=test
keycloak.admin.client-id=test-admin
keycloak.admin.client-secret=test-admin-secret

# ─── Armazenamento de arquivos ────────────────────────────────────────────────
file.storage.root=/tmp/test-files
file.storage.max-upload-size-mb=5
