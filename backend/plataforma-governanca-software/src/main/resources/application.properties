spring.application.name=plataforma-governanca-software

server.port=8081

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}

keycloak.issuer=${KEYCLOAK_TOKEN_ISSUER}

keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.token-url=${KEYCLOAK_TOKEN_URL}

keycloak.admin.server-url=http://keycloak:8080
keycloak.admin.realm=plataforma_discovery
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# Cria na inicialização os grupos de acesso (Keycloak) de organizações/projetos que ainda não têm
plataforma.grupos-acesso.migrar-na-inicializacao=true

# Cookie HttpOnly do refresh token: Secure=true em produção (HTTPS); false em dev local (HTTP)
plataforma.auth.cookie-seguro=${AUTH_COOKIE_SECURE:false}

# Datasource - lido das variáveis de ambiente injetadas pelo docker-compose
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
# validate: o schema é das migrations do Flyway; o backend não sobe se uma entidade
# não bater com as tabelas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway: aplica db/migration/V*.sql (schema e dados de referência) antes do Hibernate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# File Storage
file.storage.root=${FILE_STORAGE_ROOT:/files}
file.storage.max-upload-size-mb=${FILE_STORAGE_MAX_MB:20}

# Multipart upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

# Actuator - expõe apenas o health check (liberado no SecurityConfig), sem detalhes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger / OpenAPI: ligados por padrão. Em produção podem ser desligados pelas
# variáveis SPRINGDOC_API_DOCS_ENABLED=false e SPRINGDOC_SWAGGER_UI_ENABLED=false.
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
