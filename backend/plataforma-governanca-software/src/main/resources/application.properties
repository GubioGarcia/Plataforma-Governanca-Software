spring.application.name=plataforma-governanca-software

server.port=8081

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/plataforma_discovery/protocol/openid-connect/certs
keycloak.issuer=http://localhost:8080/realms/plataforma_discovery

keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

keycloak.admin.server-url=http://keycloak:8080
keycloak.admin.realm=plataforma_discovery
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl