spring.application.name=plataforma-governanca-software

server.port=8081

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}

keycloak.issuer=${KEYCLOAK_TOKEN_ISSUER}

keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.token-url=${KEYCLOAK_TOKEN_URL}

keycloak.admin.server-url=http://keycloak:8080
keycloak.admin.realm=plataforma_discovery
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# Datasource - lido das variáveis de ambiente injetadas pelo docker-compose
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
# update: Hibernate cria e atualiza as tabelas a partir das entidades Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Flyway desabilitado — a autoconfiguration do Flyway não funciona no Spring Boot 4.0.x
# sem o modulo spring-boot-flyway. O seed é feito via data.sql.
spring.flyway.enabled=false

# SQL initialization — data.sql roda APOS o Hibernate criar/atualizar as tabelas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# File Storage
file.storage.root=${FILE_STORAGE_ROOT:/files}
file.storage.max-upload-size-mb=${FILE_STORAGE_MAX_MB:20}

# Multipart upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB
