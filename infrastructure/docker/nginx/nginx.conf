events {}

http {

  # Permite uploads de até 25MB (margem sobre o limite de 20MB da aplicação)
  client_max_body_size 25m;

  # Mesmas zonas do ambiente hospedado (deploy/nginx/default.conf.template), com
  # taxas e rajadas folgadas: os e2e cadastram e logam dezenas de contas em
  # paralelo, do mesmo IP.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=600r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
  limit_req_status 429;

  server {
    listen 80;
    server_tokens off;

    # Mesmos cabeçalhos de segurança da produção (menos o HSTS, que exige HTTPS),
    # para os e2e exercitarem a CSP. Nenhuma location usa add_header (ela
    # descartaria os deste nível). Exceções da CSP explicadas no template de produção.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ── Frontend (React SPA) ───────────────────────────────────────────────────
    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }

    # ── Keycloak ───────────────────────────────────────────────────────────────
    location /auth {
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }

    # ── Backend API ────────────────────────────────────────────────────────────
    location = /api/auth/login {
      limit_req zone=auth burst=100 nodelay;
      proxy_pass http://backend:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }

    location = /api/usuario/cadastrar {
      limit_req zone=auth burst=100 nodelay;
      proxy_pass http://backend:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }

    # Envios da pesquisa: mesmo limite do login (a regex vence o prefixo /api/).
    location ~ ^/api/pesquisa/(antes|depois|recusa)$ {
      limit_req zone=auth burst=100 nodelay;
      proxy_pass http://backend:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }

    location /api/ {
      limit_req zone=api burst=200 nodelay;
      proxy_pass http://backend:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }

    location /swagger-ui/ {
      proxy_pass http://backend:8081/swagger-ui/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }

    location /v3/api-docs {
      proxy_pass http://backend:8081/v3/api-docs;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Port $server_port;
    }
  }
}