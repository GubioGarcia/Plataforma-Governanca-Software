name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/plataforma-governanca-software
    # Os testes usam H2; este PostgreSQL serve para aplicar as migrations do Flyway
    # e validar o schema contra as entidades (ddl-auto=validate)
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: plataforma
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d plataforma"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build e testes
        run: sh ./mvnw -B verify
      - name: Migrations do Flyway e validação do schema
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/plataforma
          SPRING_DATASOURCE_USERNAME: ci
          SPRING_DATASOURCE_PASSWORD: ci
          # O Keycloak não é chamado na partida; os valores só preenchem as propriedades
          KEYCLOAK_JWK_SET_URI: http://localhost:9/certs
          KEYCLOAK_TOKEN_ISSUER: http://localhost:9
          KEYCLOAK_TOKEN_URL: http://localhost:9/token
          KEYCLOAK_CLIENT_ID: ci
          KEYCLOAK_CLIENT_SECRET: ci
          KEYCLOAK_ADMIN_CLIENT_ID: ci
          KEYCLOAK_ADMIN_CLIENT_SECRET: ci
          PLATAFORMA_GRUPOS_ACESSO_MIGRAR_NA_INICIALIZACAO: 'false'
          FILE_STORAGE_ROOT: /tmp/arquivos
        run: |
          JAR=$(ls target/*.jar | grep -v -- '-plain' | head -1)
          java -jar "$JAR" > app.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q 'Started Plataforma' app.log && { grep 'Successfully applied\|Schema "public" is up to date' app.log; kill %1; exit 0; }
            grep -q 'APPLICATION FAILED\|Application run failed' app.log && break
            sleep 2
          done
          cat app.log; exit 1

  frontend:
    name: Frontend (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
